# HermesAgent Faceplate speech sidecar — example config.
# Mount this file at /etc/faceplate-sidecar/config.yaml inside the container,
# or set FACEPLATE_SIDECAR_CONFIG=/path/to/config.yaml for a native run.
# Environment variables override the values below where applicable; see
# faceplate_sidecar/config.py.

auth:
  # Empty token disables auth. Production deployments should set this and
  # propagate to the Faceplate via FACEPLATE_API_KEY.
  bearer_token: "${FACEPLATE_API_KEY}"
  cors_origins:
    - "http://localhost:*"
    - "app://."

asr:
  default_model: "faster-whisper-small.en"
  models:
    - name: "faster-whisper-small.en"
      backend: "faster-whisper"
      compute_type: "int8"
      device: "cpu"
    # GPU-only entries (only loaded if CUDA is present at runtime).
    - name: "faster-whisper-large-v3-turbo"
      backend: "faster-whisper"
      compute_type: "float16"
      device: "cuda"

tts:
  # Kokoro bundles every voice into a single voices-v1.0.bin file, so there
  # is no per-voice model list — `default_model` picks the voice via the
  # `kokoro:<voice_id>` convention. See GET /v1/voices for the catalog.
  default_model: "kokoro:af_bella"

wake:
  enabled: false
  backend: "openwakeword"
  models:
    - "/wakewords/hey_hermes.onnx"
  threshold: 0.5

# NOTE: the paraphrase LLM lives OUTSIDE this container. The Faceplate's
# paraphrase pass talks to your Hermes-configured LLM directly (Settings →
# Paraphrase), bypassing the agent loop so session memory isn't corrupted.

healthcheck:
  port: 8080
  path: "/health"
